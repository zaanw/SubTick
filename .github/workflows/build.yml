name: Build

on:
  push:
    branches: [main, feat/**]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure core tests
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release
      - name: Build core tests
        run: cmake --build build-tests --config Release --parallel
      - name: Run core tests
        run: ctest --test-dir build-tests --build-config Release --output-on-failure

  windows-mod:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.8.2
          cli: v3.8.0
          target: Win64
          build-config: Release
          configure-args: -DGEODE_DONT_INSTALL_MODS=ON
      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtick-windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
